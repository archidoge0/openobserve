name: "ghav human: Playwright UI Tests"
"on":
  push:
    branches:
      - ghav/dev/9015
    paths:
      - .ghav/human
env:
  COLUMNS: 150
  ZO_ROOT_USER_EMAIL: root@example.com
  ZO_ROOT_USER_PASSWORD: Complexpass#123
  ZO_BASE_URL: http://localhost:5080
  WS_ZO_BASE_URL: ws://localhost:5080
  ZO_BASE_URL_SC: http://localhost:5080
  ZO_BASE_URL_SC_UI: http://localhost:5080
  INGESTION_URL: http://localhost:5080
  ORGNAME: default
  ZO_QUICK_MODE_NUM_FIELDS: 100
  ZO_QUICK_MODE_STRATEGY: first
  ZO_ALLOW_USER_DEFINED_SCHEMAS: true
  ZO_INGEST_ALLOWED_UPTO: 5
  ZO_FEATURE_QUERY_EXCLUDE_ALL: false
  ZO_USAGE_BATCH_SIZE: 200
  ZO_USAGE_PUBLISH_INTERVAL: 2
  ZO_USAGE_REPORTING_ENABLED: true
  ZO_MIN_AUTO_REFRESH_INTERVAL: 5
  ZO_STREAMING_ENABLED: true
  ZO_COLS_PER_RECORD_LIMIT: "80000"
  ZO_SMTP_ENABLED: true
  ZO_FORMAT_STREAM_NAME_TO_LOWERCASE: false
  ZO_CREATE_ORG_THROUGH_INGESTION: true
  ZO_UTF8_VIEW_ENABLED: false
  UPLOAD_TO_TESTDINO: ${{ vars.UPLOAD_TO_TESTDINO || 'false' }}
jobs:
  build_binary:
    name: build_binary
    runs-on: ubuntu-latest
    steps:
      - name: Remove unused tools
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: Clone the current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-07-20
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: playwright
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "21.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build frontend code
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_COVERAGE: "true"
          COVERAGE: "true"
        run: cd web && npm install && npm run build
      - name: Build and run binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/x86_64-unknown-linux-gnu/release/openobserve
          retention-days: 1
    timeout-minutes: 360
  ui_integration_tests:
    name: e2e / ${{ matrix.testfolder }}
    needs:
      - build_binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - testfolder: GeneralTests
            browser: chrome
            run_files:
              - sanity.spec.js
              - changeOrg.spec.js
              - enrichment.spec.js
              - schema.spec.js
              - schemaload.spec.js
              - serviceAccount.spec.js
              - usersOrg.spec.js
              - org.spec.js
          - testfolder: Logs-Core
            browser: chrome
            run_files:
              - join.spec.js
              - logshistogram.spec.js
              - logspage.spec.js
              - logsquickmode.spec.js
              - pagination.spec.js
              - unflattened.spec.js
              - logstable.spec.js
          - testfolder: Logs-Queries
            browser: chrome
            run_files:
              - logsDownloads.spec.js
              - logsqueries.spec.js
              - secondsPrecisionAdded.spec.js
              - logsqueries.cte.spec.js
              - logsqueries.matchall.spec.js
              - searchpartition.spec.js
          - testfolder: Alerts
            browser: chrome
            run_files:
              - alerts-e2e-flow.spec.js
              - alerts-ui-operations.spec.js
              - alerts-import.spec.js
          - testfolder: Dashboards-Core
            browser: chrome
            run_files:
              - dashboard.spec.js
              - dashboard2.spec.js
              - dashboardtype.spec.js
              - dashboard-folder.spec.js
              - dashboard-import.spec.js
              - maxquery.spec.js
          - testfolder: Dashboards-Settings
            browser: chrome
            run_files:
              - dashboard-filter.spec.js
              - dashboard-general-setting.spec.js
              - dashboard-tabs-setting.spec.js
              - dashboard-variables-setting.spec.js
              - dashboard-transpose.spec.js
          - testfolder: Dashboards-Charts
            browser: chrome
            run_files:
              - custom-charts.spec.js
              - dashboard-geoMap.spec.js
              - dashboard-maps.spec.js
              - dashboard-multi-y-axis.spec.js
              - dashboard-html-chart.spec.js
              - visualize.spec.js
          - testfolder: Dashboards-Streaming
            browser: chrome
            run_files:
              - dashboard-streaming.spec.js
          - testfolder: Pipelines
            browser: chrome
            run_files:
              - pipelines.spec.js
              - pipeline-dynamic.spec.js
              - pipeline-core.spec.js
          - testfolder: Reports
            browser: chrome
            run_files:
              - reportsScheduleNow.spec.js
              - reportsScheduleLater.spec.js
          - testfolder: Streams
            browser: chrome
            run_files:
              - multiselect-stream.spec.js
              - streamname.spec.js
              - streaming.spec.js
    steps:
      - name: Clone the current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-binary
          path: release-binary
      - name: Start OpenObserve
        run: chmod +x ./release-binary/openobserve && ./release-binary/openobserve > o2.log 2>&1 &
      - name: Wait for start
        run: sleep 60
      - name: Ensure we are getting a reply from the server
        run: curl http://localhost:5080/web/login
      - name: Create coverage json folder
        run: mkdir -p tests/ui-testing/.nyc_output
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check if this is a rerun
        id: check_rerun
        run: |
          echo "::notice::GitHub run attempt: ${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" -gt "1" ]; then
            echo "is_rerun=true" >> $GITHUB_OUTPUT
            echo "::notice::This is a rerun (attempt ${{ github.run_attempt }}). Will attempt to run only failed tests."
          else
            echo "is_rerun=false" >> $GITHUB_OUTPUT
            echo "::notice::This is the first run. Will run all tests in matrix."
          fi
      - name: Install dependencies and run ui-tests
        env:
          TESTDINO_TOKEN: ${{ '' }}
        run: "touch .env\necho \"ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}\" >> .env\necho \"ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}\" >> .env\necho \"ZO_BASE_URL=${ZO_BASE_URL}\" >> .env\necho \"WS_ZO_BASE_URL=${WS_ZO_BASE_URL}\" >> .env\necho \"ZO_BASE_URL_SC=${ZO_BASE_URL_SC}\" >> .env\necho \"ZO_BASE_URL_SC_UI=${ZO_BASE_URL_SC_UI}\" >> .env\necho \"INGESTION_URL=${INGESTION_URL}\" >> .env\necho \"ORGNAME=${ORGNAME}\" >> .env\necho \"ZO_SMTP_ENABLED=${ZO_SMTP_ENABLED}\" >> .env\nmv .env tests/ui-testing\ncd tests/ui-testing && npm ci\nnpx playwright install --with-deps chromium\n\n# Check if this is a rerun\nIS_RERUN=\"${{ steps.check_rerun.outputs.is_rerun }}\"\n\nif [ \"$IS_RERUN\" = \"true\" ]; then\n  echo \"::group::Fetching last failed tests from TestDino\"\n  # Try to get last failed tests from TestDino\n  # Redirect stderr to /dev/null to avoid capturing npm warnings\n  if LAST_FAILED_FLAGS=\"$(npx tdpw last-failed 2>/dev/null)\"; then\n    # Trim whitespace\n    LAST_FAILED_FLAGS=\"$(echo \"$LAST_FAILED_FLAGS\" | xargs)\"\n\n    if [ -n \"$LAST_FAILED_FLAGS\" ] && [ \"$LAST_FAILED_FLAGS\" != \"No failed tests found\" ]; then\n      echo \"::notice::✅ Found failed tests from previous run.\"\n      echo \"::notice::TestDino flags: $LAST_FAILED_FLAGS\"\n      RERUN_MODE=\"optimized\"\n      EXTRA_PW_FLAGS=\"$LAST_FAILED_FLAGS\"\n    else\n      echo \"::warning::TestDino returned no failed tests. Falling back to running all tests in this matrix job.\"\n      echo \"::warning::This means you'll be billed for all tests. Please investigate why last-failed returned empty.\"\n      RERUN_MODE=\"fallback\"\n      EXTRA_PW_FLAGS=\"\"\n    fi\n  else\n    echo \"::error::Failed to fetch last failed tests from TestDino (exit code: $?).\"\n    echo \"::warning::Falling back to running all tests in this matrix job.\"\n    echo \"::warning::This means you'll be billed for all tests. Please check TestDino integration.\"\n    RERUN_MODE=\"fallback\"\n    EXTRA_PW_FLAGS=\"\"\n  fi\n  echo \"::endgroup::\"\nelse\n  RERUN_MODE=\"normal\"\n  EXTRA_PW_FLAGS=\"\"\nfi\n\n# Get list of files to run using join function\nFILE_LIST=\"${{ join(matrix.run_files, ' ') }}\"\necho \"DEBUG: FILE_LIST = $FILE_LIST\"\necho \"DEBUG: matrix.testfolder = ${{ matrix.testfolder }}\"\n\nif [ -n \"$FILE_LIST\" ]; then\n  # Map logical folder names to actual directories\n  case \"${{ matrix.testfolder }}\" in\n    \"Logs-Core\"|\"Logs-Queries\")\n      ACTUAL_FOLDER=\"Logs\"\n      ;;\n    \"Dashboards-Core\"|\"Dashboards-Settings\"|\"Dashboards-Charts\"|\"Dashboards-Streaming\")\n      ACTUAL_FOLDER=\"Dashboards\"\n      ;;\n    *)\n      ACTUAL_FOLDER=\"${{ matrix.testfolder }}\"\n      ;;\n  esac\n\n  echo \"DEBUG: ACTUAL_FOLDER = $ACTUAL_FOLDER\"\n\n  # Build file paths\n  FILE_PATHS=\"\"\n  for file in $FILE_LIST; do\n    FILE_PATH=\"./playwright-tests/$ACTUAL_FOLDER/$file\"\n    echo \"DEBUG: Will run file: $FILE_PATH\"\n    FILE_PATHS=\"$FILE_PATHS $FILE_PATH\"\n  done\n\n  # Determine what to run based on rerun mode\n  if [ \"$RERUN_MODE\" = \"optimized\" ]; then\n    # TestDino returns: \"Pipelines/pipeline-core.spec.js -g test name here\"\n    # We need to: \"./playwright-tests/Pipelines/pipeline-core.spec.js\" \"-g\" \"test name here\"\n    # Extract file path (before -g) and test name (after -g)\n    FILE_PATH=$(echo \"$EXTRA_PW_FLAGS\" | sed 's/ -g.*//')\n    TEST_NAME=$(echo \"$EXTRA_PW_FLAGS\" | sed 's/.*-g //')\n\n    FIXED_FILE_PATH=\"./playwright-tests/$FILE_PATH\"\n\n    echo \"::notice::\U0001F3AF OPTIMIZED RERUN: Running only failed tests\"\n    echo \"DEBUG: Original TestDino flags: $EXTRA_PW_FLAGS\"\n    echo \"DEBUG: File path: $FIXED_FILE_PATH\"\n    echo \"DEBUG: Test name: $TEST_NAME\"\n    echo \"DEBUG: Final command: npx playwright test \\\"$FIXED_FILE_PATH\\\" -g \\\"$TEST_NAME\\\"\"\n    npx playwright test \"$FIXED_FILE_PATH\" -g \"$TEST_NAME\"\n  else\n    # Normal run or fallback\n    if [ \"$RERUN_MODE\" = \"fallback\" ]; then\n      echo \"::warning::⚠️ FALLBACK RERUN: Running all tests in matrix (TestDino optimization failed)\"\n    fi\n    echo \"DEBUG: Final command: npx playwright test$FILE_PATHS\"\n    npx playwright test $FILE_PATHS\n  fi\nelse\n  echo \"No files specified to run for ${{ matrix.testfolder }} folder\"\nfi \n"
      - name: Sanitize Test Folder Name
        shell: bash
        run: |
          # Assign the matrix variable to a Bash variable
          SANITIZED_FOLDERNAME="${{ matrix.testfolder }}"
          # Export as a GitHub Actions environment variable
          echo "SANITIZED_FOLDERNAME=$SANITIZED_FOLDERNAME" >> $GITHUB_ENV
      - name: Upload Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage-${{ env.SANITIZED_FOLDERNAME }}
          path: tests/ui-testing/.nyc_output
          include-hidden-files: true
      - name: Generate Coverage Report
        run: cd tests/ui-testing && npx nyc report
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.testfolder }}
          path: tests/ui-testing/blob-report
          retention-days: 1
      - name: Check OpenObserve logs
        if: always()
        run: cat o2.log
  merge_and_upload_reports:
    name: Merge Reports and Upload to TestDino
    needs:
      - ui_integration_tests
    if: ${{ !cancelled() && needs.ui_integration_tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the current repo
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install project dependencies
        run: cd tests/ui-testing && npm ci
      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v4
        with:
          path: tests/ui-testing/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge Reports
        run: |
          cd tests/ui-testing

          # Unset CI to use non-CI reporter config (html + json instead of blob)
          unset CI
          npx playwright merge-reports --config playwright.config.js ./all-blob-reports

          echo "Contents of playwright-results:"
          ls -la playwright-results/
          echo "Contents of html-report:"
          ls -la playwright-results/html-report/
          echo "Checking report.json:"
          ls -lh playwright-results/report.json
  generate_coverage_report:
    name: Generate Coverage Report
    needs:
      - build_binary
      - ui_integration_tests
    runs-on: ubuntu-latest
    if: success() || failure()
    steps:
      - name: Clone the current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download Playwright Coverage Data
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-coverage-*
          path: merged-coverage
          merge-multiple: true
      - name: Verify Downloaded Files
        run: ls -R merged-coverage
      - name: Move Coverage Files to .nyc_output
        run: |
          mkdir -p tests/ui-testing/.nyc_output
          mv merged-coverage/* tests/ui-testing/.nyc_output/ || echo "No files to move"
      - name: Generate Coverage Report
        run: cd tests/ui-testing && npm ci && npx nyc report
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: hashFiles('tests/ui-testing/coverage-report/**') != ''
        with:
          name: coverage-report
          path: tests/ui-testing/coverage-report
          retention-days: 7
  playwright_summary:
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - build_binary
      - ui_integration_tests
      - merge_and_upload_reports
      - generate_coverage_report
    if: always()
    steps:
      - name: Check test results
        run: |
          # Check all job results - accept success or skipped for all jobs
          BUILD_OK=false
          UI_OK=false
          MERGE_OK=false
          COV_OK=false

          if [ "${{ needs.build_binary.result }}" == "success" ] || [ "${{ needs.build_binary.result }}" == "skipped" ]; then
            BUILD_OK=true
          fi

          if [ "${{ needs.ui_integration_tests.result }}" == "success" ] || [ "${{ needs.ui_integration_tests.result }}" == "skipped" ]; then
            UI_OK=true
          fi

          if [ "${{ needs.merge_and_upload_reports.result }}" == "success" ] || [ "${{ needs.merge_and_upload_reports.result }}" == "skipped" ]; then
            MERGE_OK=true
          fi

          if [ "${{ needs.generate_coverage_report.result }}" == "success" ] || [ "${{ needs.generate_coverage_report.result }}" == "skipped" ]; then
            COV_OK=true
          fi

          if [ "$BUILD_OK" == "true" ] && [ "$UI_OK" == "true" ] && [ "$MERGE_OK" == "true" ] && [ "$COV_OK" == "true" ]; then
            echo "All Playwright tests completed successfully"
            exit 0
          else
            echo "Playwright tests failed:"
            echo "  build_binary: ${{ needs.build_binary.result }}"
            echo "  ui_integration_tests: ${{ needs.ui_integration_tests.result }}"
            echo "  merge_and_upload_reports: ${{ needs.merge_and_upload_reports.result }}"
            echo "  generate_coverage_report: ${{ needs.generate_coverage_report.result }}"
            exit 1
          fi
