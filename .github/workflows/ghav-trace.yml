        shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.testfolder }}-attempt-${{ github.run_attempt }}
          path: tests/ui-testing/blob-report
          retention-days: 1
      - name: Check OpenObserve logs
        if: always()
        run: cat o2.log
        shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
        env:
          GHAV_STEP: 10-Check_OpenObserve_logs
      - name: ghav finalize
        if: always()
        continue-on-error: true
        working-directory: /home/runner
        run: bash $HOME/ghav-bin/finalize.sh
      - name: ghav summarize
        if: always()
        continue-on-error: true
        working-directory: /home/runner
        run: mkdir -p /home/runner/ghav-trace && python3 $HOME/ghav-bin/summarize.py $HOME/ghav-trace-summary.json.gz
      - name: ghav upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ghav-trace-ui_integration_tests-${{ strategy.job-index }}
          path: /home/runner/ghav-trace-summary.json.gz
          retention-days: 30
    env:
      GHAV_TRACE_DIR: /home/runner/ghav-trace
      UV_USE_IO_URING: "0"
    timeout-minutes: 180
